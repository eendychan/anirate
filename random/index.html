<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniRate — Случайный выбор</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { anilist: { bg: '#0B1622', card: '#151F2E', border: '#2A3A4E', accent: '#3DB4F2', text: '#EDF1F5', muted: '#9FADBD' } },
                    fontFamily: { rubik: ['Rubik', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-sky-500/30 selection:text-sky-300">

    <header class="w-full bg-[#151F2E]/90 backdrop-blur-md sticky top-0 z-50 border-b border-[#2A3A4E]/60 px-3 py-2">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-4">
                <a href="../" class="font-rubik-black text-lg tracking-wide text-white hover:opacity-85 transition flex items-center gap-1">
                    Ani<span class="text-[#3DB4F2]">Rate</span>
                </a>
                <div class="hidden sm:flex items-center gap-3">
                    <a href="../" class="text-xs font-bold text-[#EDF1F5] hover:text-[#3DB4F2] transition">Главная</a>
                    <a href="./" class="text-xs font-bold text-[#3DB4F2] transition">Рандом</a>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="openSearchModal()" title="Поиск" class="flex items-center justify-center w-9 h-9 rounded-xl bg-[#1E2C3D] hover:bg-[#2A3A4E] border border-[#2A3A4E] text-[#9FADBD] hover:text-[#3DB4F2] transition">
                    <span class="material-symbols-outlined text-base">search</span>
                </button>
                <button onclick="toggleSavedDrawer()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-[#1E2C3D] hover:bg-[#2A3A4E] border border-[#2A3A4E] text-[#3DB4F2] text-xs font-bold transition shrink-0">
                    <span class="material-symbols-outlined text-base">bookmarks</span>
                    <span class="hidden sm:inline">Список</span>
                    <span id="saved-count-badge" class="bg-[#3DB4F2]/20 text-[#3DB4F2] px-1.5 py-0.2 rounded-md text-[10px]">0</span>
                </button>

                <!-- Авторизация -->
                <div id="auth-container">
                    <button onclick="loginAniList()" class="px-3 py-1.5 rounded-xl bg-[#3DB4F2]/20 border border-[#3DB4F2] text-[#3DB4F2] text-xs font-bold hover:bg-[#3DB4F2]/30 transition flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-base">login</span> <span>Авторизация</span>
                    </button>
                </div>

                <!-- Меню переполнения -->
                <div class="relative">
                    <button onclick="toggleOverflowMenu(event)" class="w-9 h-9 rounded-xl bg-[#1E2C3D] hover:bg-[#2A3A4E] border border-[#2A3A4E] text-[#9FADBD] hover:text-[#3DB4F2] flex items-center justify-center transition">
                        <span class="material-symbols-outlined text-base">more_vert</span>
                    </button>
                    <div id="overflow-menu" class="absolute right-0 mt-2 w-44 bg-[#151F2E] border border-[#2A3A4E] rounded-xl shadow-2xl hidden z-50 p-1.5 space-y-1">
                        <button onclick="toggleTheme()" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-bold text-[#EDF1F5] hover:bg-[#1E2C3D] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm text-[#3DB4F2]">contrast</span> <span>Тема</span>
                        </button>
                        <button onclick="toggleLanguage()" class="w-full text-left px-3 py-1.5 rounded-lg text-xs font-bold text-[#EDF1F5] hover:bg-[#1E2C3D] flex items-center gap-2">
                            <span class="material-symbols-outlined text-sm text-[#3DB4F2]">language</span> <span>Язык (RU/EN)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Search Modal -->
    <div id="search-modal" class="fixed inset-0 z-50 bg-[#0B1622]/80 backdrop-blur-md hidden flex flex-col items-center justify-start pt-12 sm:pt-16 px-4">
        <div class="max-w-2xl w-full bg-[#151F2E] rounded-2xl border border-[#2A3A4E] shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="p-3 border-b border-[#2A3A4E] flex items-center gap-3 bg-[#0B1622]/40 shrink-0">
                <span class="material-symbols-outlined text-[#3DB4F2] text-xl">search</span>
                <input type="text" id="anime-search-input" placeholder="Введите название аниме или манги..." autocomplete="off"
                       class="bg-transparent border-none outline-none text-sm w-full text-white placeholder-[#9FADBD]/60">
                <div id="search-loading" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-[#3DB4F2] border-t-transparent shrink-0"></div>
                <button onclick="closeSearchModal()" class="w-8 h-8 rounded-xl bg-[#1E2C3D] hover:bg-[#2A3A4E] flex items-center justify-center text-[#9FADBD]">
                    <span class="material-symbols-outlined text-lg">close</span>
                </button>
            </div>
            <div id="search-results" class="overflow-y-auto p-3 space-y-4">
                <div class="p-6 text-center text-xs text-[#9FADBD]">Начните вводить название...</div>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="fixed inset-0 z-50 bg-[#0B1622]/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="max-w-xl w-full bg-[#151F2E] rounded-2xl border border-[#2A3A4E] shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-3 border-b border-[#2A3A4E] flex items-center gap-3 bg-[#0B1622]/40 shrink-0">
                <span class="material-symbols-outlined text-[#3DB4F2]">search</span>
                <input type="text" id="profile-search-input" placeholder="Поиск пользователя AniList по нику..." onkeydown="if(event.key==='Enter') searchUserProfile(this.value)"
                       class="bg-transparent border-none outline-none text-xs w-full text-white placeholder-[#9FADBD]/60">
                <button onclick="closeProfileModal()" class="w-7 h-7 rounded-lg hover:bg-[#1E2C3D] flex items-center justify-center text-[#9FADBD]">
                    <span class="material-symbols-outlined text-base">close</span>
                </button>
            </div>
            <div id="profile-modal-content" class="p-4 overflow-y-auto space-y-4 text-xs text-[#EDF1F5]"></div>
        </div>
    </div>

    <!-- Рандомайзер контент -->
    <main class="flex-1 w-full flex flex-col items-center p-4 sm:p-8 space-y-6">
        <div class="max-w-2xl w-full bg-[#151F2E] rounded-2xl border border-[#2A3A4E] p-5 shadow-2xl space-y-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="material-symbols-outlined text-[#3DB4F2]">casino</span>
                    <h2 class="font-rubik-black text-base text-white">Рандомайзер тайтлов</h2>
                </div>
                <div class="flex bg-[#0B1622] p-1 rounded-xl border border-[#2A3A4E]">
                    <button id="rand-type-anime" onclick="setRandomMediaType('ANIME')" class="px-4 py-1.5 rounded-lg text-xs font-bold bg-[#3DB4F2] text-[#0B1622] transition">Аниме</button>
                    <button id="rand-type-manga" onclick="setRandomMediaType('MANGA')" class="px-4 py-1.5 rounded-lg text-xs font-bold text-[#9FADBD] hover:text-white transition">Манга</button>
                </div>
            </div>

            <!-- Колесо / Анимация -->
            <div class="flex justify-center py-4 wheel-container">
                <div class="w-32 h-32 rounded-full neon-wheel flex items-center justify-center relative overflow-hidden" id="half-wheel-disc">
                    <div class="absolute inset-2 bg-[#151F2E] rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-3xl text-[#3DB4F2] animate-spin">refresh</span>
                    </div>
                </div>
            </div>

            <!-- Настройки фильтров -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#9FADBD]">Жанр</label>
                    <select id="rand-genre" class="w-full bg-[#0B1622] border border-[#2A3A4E] rounded-xl p-2 text-xs text-white outline-none">
                        <option value="">Любой</option>
                        <option value="Action">Экшен</option>
                        <option value="Romance">Романтика</option>
                        <option value="Fantasy">Фэнтези</option>
                        <option value="Psychological">Триллер / Психология</option>
                        <option value="Comedy">Комедия</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#9FADBD]">Формат</label>
                    <select id="rand-format" class="w-full bg-[#0B1622] border border-[#2A3A4E] rounded-xl p-2 text-xs text-white outline-none">
                        <option value="">Любой</option>
                        <option value="TV">TV сериал</option>
                        <option value="MOVIE">Фильм</option>
                        <option value="OVA">OVA</option>
                        <option value="MANGA">Манга</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#9FADBD]">Минимальный балл (%)</label>
                    <input type="number" id="rand-score-min" placeholder="0" min="0" max="100" class="w-full bg-[#0B1622] border border-[#2A3A4E] rounded-xl p-2 text-xs text-white outline-none">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#9FADBD]">Количество результатов</label>
                    <select id="rand-count" class="w-full bg-[#0B1622] border border-[#2A3A4E] rounded-xl p-2 text-xs text-white outline-none">
                        <option value="1">1 тайтл</option>
                        <option value="3">3 тайтла</option>
                        <option value="5">5 тайтлов</option>
                    </select>
                </div>
            </div>

            <button onclick="executeRandomRoll(this)" class="bouncy-chip w-full py-3 rounded-xl bg-[#3DB4F2] hover:bg-[#02A9FF] text-[#0B1622] font-rubik-black text-sm transition shadow-lg flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">shuffle</span> Крутить рандомайзер
            </button>
        </div>

        <div id="random-results-section" class="max-w-2xl w-full space-y-3 hidden">
            <h3 class="font-rubik-black text-sm text-white">Результаты жеребьевки:</h3>
            <div id="random-results-grid" class="space-y-3"></div>
        </div>
    </main>

    <footer class="w-full text-center py-4 text-xs text-[#9FADBD]/60 border-t border-[#2A3A4E]/50 bg-[#0B1622] mt-auto">
        AniRate • Случайный выбор
    </footer>

    <!-- Saved Drawer -->
    <div id="saved-drawer" class="fixed inset-0 bg-[#0B1622]/80 backdrop-blur-sm z-50 flex justify-end hidden">
        <div class="bg-[#151F2E] max-w-sm w-full h-full shadow-2xl flex flex-col border-l border-[#2A3A4E]">
            <div class="p-3.5 border-b border-[#2A3A4E] flex items-center justify-between">
                <div class="flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[#3DB4F2] text-lg">collections_bookmark</span>
                    <div>
                        <h3 class="font-rubik-black text-xs text-white">Сохраненные</h3>
                        <p class="text-[10px] text-[#9FADBD]" id="drawer-subtitle">0 элементов</p>
                    </div>
                </div>
                <button onclick="toggleSavedDrawer()" class="w-7 h-7 rounded-lg hover:bg-[#1E2C3D] flex items-center justify-center text-[#9FADBD]">
                    <span class="material-symbols-outlined text-base">close</span>
                </button>
            </div>
            <div class="p-2 border-b border-[#2A3A4E] flex gap-1 bg-[#0B1622]/40">
                <button id="drawer-tab-anime" onclick="switchDrawerTab('ANIME')" class="flex-1 py-1 rounded-lg text-xs font-bold bg-[#3DB4F2] text-[#0B1622]">Аниме</button>
                <button id="drawer-tab-manga" onclick="switchDrawerTab('MANGA')" class="flex-1 py-1 rounded-lg text-xs font-bold text-[#9FADBD]">Манга</button>
            </div>
            <div id="saved-list-container" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
            <div class="p-3 border-t border-[#2A3A4E] bg-[#0B1622] flex justify-between items-center gap-2">
                <button onclick="exportRatingsJson()" class="px-3 py-2 rounded-xl bg-[#1E2C3D] text-[#3DB4F2] text-xs font-bold border border-[#2A3A4E]">JSON</button>
                <button onclick="clearAllRatings()" class="px-3 py-2 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs font-bold">Очистить</button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#151F2E] text-[#3DB4F2] px-4 py-2.5 rounded-xl shadow-2xl border border-[#3DB4F2]/30 text-xs font-bold opacity-0 pointer-events-none z-50 flex items-center gap-1.5 transition-all">
        <span class="material-symbols-outlined text-sm">info</span>
        <span id="toast-text">Уведомление</span>
    </div>

    <script src="../script.js"></script>
    <script>
        window.onload = function() {
            initCommon();
        };
    </script>
</body>
</html>
